[project]
name = "kobbe"
description = "Post-processing and basic analysis of ice and ocean data from Nortek Signature ADCPs."
version = "0.0.1"
readme = "README.md"

authors = [
  { name = "Øyvind Foss", email = "oyvind.foss@npolar.no" }, 
]

maintainers = [
  { name = "Øyvind Foss, Norwegian Polar Institute, Oceanography section", email = "" },
]

requires-python = ">=3.11"
dependencies = [
  xarray,
  pandas,
  ipython
  "numpy>=1.23,<2.0",
  "scipy>=1.11.3",
  "matplotlib>=3.7.2",
  "gsw>=3.6.18", 
  "glob2>=0.7",
  "kval>=0.5.1",
]


classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Oceanography",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
  requests
 ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/NPIOcean/kobbe/"